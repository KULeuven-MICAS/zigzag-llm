name: balanced_df_1_64_16

# balanced dataflow with 1x64x16 PE array
# Assumed 1 GHz clock
# On-chip: 128 KB @ 256 GB/s on-chip buffer
# Off-chip: DRAM @ 32 GB/s

# Energy values
# DRAM: 10 pJ/bit
# SRAM: 1 pJ/bit
# RF:   0.01 pJ/bit
# MAC:  0.01 pJ/bit
# w_cost = 1.5x r_cost

memories:
  rf_O:
    size: 32
    r_bw: 32
    w_bw: 32
    r_cost: 0.8
    w_cost: 0.8
    area: 0
    r_port: 2
    w_port: 2
    rw_port: 0
    latency: 1
    min_r_granularity: 16
    min_w_granularity: 16
    operands: [O]
    ports:
      - fh: w_port_1
        tl: r_port_1
        fl: w_port_2
        th: r_port_2
    served_dimensions: []

  sram_128KB:
    size: 1_048_576
    r_bw: 2048
    w_bw: 2048
    r_cost: 2048  # /4 compared to FLAT paper since 4x less bandwidth
    w_cost: 2048  # /4 compared to FLAT paper since 4x less bandwidth
    area: 0
    r_port: 3
    w_port: 3
    rw_port: 0
    latency: 1
    min_r_granularity: 256
    min_w_granularity: 256
    operands: [I1, I2, O]
    ports:
      - fh: w_port_1
        tl: r_port_1
      - fh: w_port_2
        tl: r_port_2
      - fh: w_port_3
        tl: r_port_3
        fl: w_port_3
        th: r_port_3
    served_dimensions: [D1, D2, D3]

  dram:
    # From FLAT paper: 400 GB/s off-chip BW
    size: 10_000_000_000_000_000
    r_bw: 256
    w_bw: 256
    r_cost: 4096
    w_cost: 4096
    area: 0
    r_port: 0
    w_port: 0
    rw_port: 1
    latency: 1
    min_r_granularity: 512
    min_w_granularity: 512
    operands: [I1, I2, O]
    ports:
      - fh: rw_port_1
        tl: rw_port_1
      - fh: rw_port_1
        tl: rw_port_1
      - fh: rw_port_1
        tl: rw_port_1
        fl: rw_port_1
        th: rw_port_1
    served_dimensions: [D1, D2, D3]

operational_array:
  input_precision: [8, 32]
  multiplier_energy: 1.5
  multiplier_area: 1 # unit
  dimensions: [D1, D2, D3]  # D2 is accumulation dimension (Cu in ZigZag)
  sizes: [1, 64, 16]

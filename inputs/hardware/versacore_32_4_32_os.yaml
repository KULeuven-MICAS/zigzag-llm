name: balanced_df_16_16_16

# balanced dataflow with 1x64x16 PE array
# Assumed 1 GHz clock
# On-chip: 128 KB @ 256 GB/s on-chip buffer
# Off-chip: DRAM @ 32 GB/s

# Energy values
# DRAM: 10 pJ/bit
# SRAM: 1 pJ/bit
# RF:   0.01 pJ/bit
# MAC:  0.01 pJ/bit
# w_cost = 1.5x r_cost

memories:
  rf_O:
    size: 32
    r_cost: 0.0768
    w_cost: 0.1472
    area: 0
    latency: 1
    operands: [O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 32
        bandwidth_max: 32
        allocation: 
          - O, tl
      - name: w_port_1
        type: write
        bandwidth_min: 32
        bandwidth_max: 32
        allocation: 
          - O, fh
      - name: r_port_2
        type: read
        bandwidth_min: 32
        bandwidth_max: 32
        allocation: 
          - O, th
      - name: w_port_2
        type: write
        bandwidth_min: 32
        bandwidth_max: 32
        allocation: 
          - O, fl
    served_dimensions: [D2]

  streamer_I1:
    size: 2048
    r_cost: 4.9152
    w_cost: 9.4208
    area: 0
    latency: 1
    operands: [I1]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 2048
        bandwidth_max: 2048
        allocation: 
          - I1, tl
      - name: w_port_1
        type: write
        bandwidth_min: 2048
        bandwidth_max: 2048
        allocation: 
          - I1, fh
    served_dimensions: [D1, D2, D3]

  streamer_I2:
    size: 2048
    r_cost: 4.9152
    w_cost: 9.4208
    area: 0
    latency: 1
    operands: [I2]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 2048
        bandwidth_max: 2048
        allocation: 
          - I2, tl
      - name: w_port_1
        type: write
        bandwidth_min: 2048
        bandwidth_max: 2048
        allocation: 
          - I2, fh
    served_dimensions: [D1, D2, D3]

  streamer_O:
    size: 8192
    r_cost: 19.66
    w_cost: 37.6832
    area: 0
    latency: 1
    operands: [O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation: 
          - O, tl
      - name: w_port_1
        type: write
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation: 
          - O, fh
      - name: r_port_2
        type: read
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation: 
          - O, th
      - name: w_port_2
        type: write
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation: 
          - O, fl
    served_dimensions: [D1, D2, D3]

  sram_1MB:
    size: 8388608 # in bits, 1MB
    r_cost: 450.56  # /4 compared to FLAT paper since 4x less bandwidth
    w_cost: 578  # /4 compared to FLAT paper since 4x less bandwidth
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation: 
          - I1, tl
      - name: w_port_1
        type: write
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation: 
          - I1, fh
      - name: r_port_2
        type: read
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation: 
          - I2, tl
      - name: w_port_2
        type: write
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation: 
          - I2, fh
      - name: r_port_3
        type: read
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation: 
          - O, tl
          - O, th
      - name: w_port_3
        type: write
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation: 
          - O, fl
          - O, fh
    served_dimensions: [D1, D2, D3]

  dram:
    # From FLAT paper: 400 GB/s off-chip BW
    size: 10000000000
    r_cost: 0
    w_cost: 0
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: rw_port_1
        type: read_write
        bandwidth_min: 16384 # mimic unlimited BW for now
        bandwidth_max: 16384 # mimic unlimited BW for now
        allocation: 
          - I1, tl
          - I2, tl
          - O, tl
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
          - O, th
    served_dimensions: [D1, D2, D3]

operational_array:
  input_precision: [8, 32]
  unit_energy: 0.227
  unit_area: 1 # unit
  dimensions: [D1, D2, D3]  # D2 is accumulation dimension (Cu in ZigZag)
  sizes: [16, 16, 16]
